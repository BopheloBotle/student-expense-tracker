services:
  db:
    image: postgres:16
    container_name: expense_tracker_db
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: expense_user
      POSTGRES_PASSWORD: expense_pass
    ports:
      - "5433:5432"
    volumes:
      - expense_tracker_pgdata:/var/lib/postgresql/data

volumes:
  expense_tracker_pgdata:

