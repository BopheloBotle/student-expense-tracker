# =========================
# SERVER
# =========================
server.port=${PORT:8080}

# =========================
# POSTGRES DATABASE
# =========================
spring.datasource.url=jdbc:postgresql://${DB_HOST:student-expense-tracker.postgres.database.azure.com}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
# Azure Postgres typically requires username in the form: user@server
spring.datasource.username=${DB_USERNAME:pgAdmin@student-expense-tracker}
spring.datasource.password=${Oyamamakuzeni24}

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =========================
# JWT (any length; app hashes with SHA-256 for HS256 signing)
# =========================
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MINUTES:60}
jwt.issuer=${JWT_ISSUER:expense-tracker}
